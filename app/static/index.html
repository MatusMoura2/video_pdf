<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MF Video IA Transcritor</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Main Style -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header glass">
            <div class="logo">MF Video IA <span>Transcritor</span></div>
            <div class="upload-controls" style="display:flex; gap:10px; align-items:center;">
                <!-- URL input for public videos -->
                <input type="text" id="url-input" placeholder="Cole o link do vídeo (YouTube, etc)" style="padding: 0.5rem; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3); color: white; width: 250px;">
                <button id="btn-import-url" class="btn" style="margin-left: 0;">Importar Link</button>
                
                <span style="color:#64748b; margin: 0 5px;">ou</span>
                
                <label for="video-upload" class="btn" style="margin-left: 0;">Carregar Arquivo</label>
                <input type="file" id="video-upload" accept="video/mp4,video/webm" hidden>
            </div>
        </header>

        <!-- Main Content -->
        <main class="split-layout">
            <!-- Left Panel: Video -->
            <section class="panel video-panel glass" id="left-panel">
                <div class="panel-header">Vídeo</div>
                <div class="video-wrapper">
                    <video id="main-video" controls>
                        Seu navegador não suporta a tag de vídeo.
                    </video>
                </div>
            </section>

            <!-- Resizer Divider -->
            <div class="resizer" id="dragMe"></div>

            <!-- Right Panel: Transcription -->
            <section class="panel pdf-panel glass" id="right-panel">
                <div class="panel-header" style="display:flex; justify-content: space-between; align-items:center;">
                    <span>Transcrição Interativa</span>
                    <div style="display:flex; align-items:center; gap:10px;">
                        <span id="status-indicator" style="font-size: 0.8rem; color: #94a3b8;">Aguardando...</span>
                        <a id="btn-download-pdf" class="btn" style="display:none; padding: 0.3rem 0.6rem; font-size: 0.8rem; background: #8b5cf6;" href="#" download>Baixar PDF</a>
                    </div>
                </div>
                <div id="transcription-container" style="flex: 1; overflow-y: auto; padding: 1rem; background: #0f172a; color: #f1f5f9;">
                    <p class="placeholder-text" style="color:#64748b; text-align:center; margin-top:2rem;">
                        Carregue um vídeo para iniciar a IA (Whisper)
                    </p>
                </div>
            </section>
        </main>
    </div>

    <!-- App Scripts -->
    <script src="/static/js/app.js"></script>
    <script src="/static/js/sync_engine.js"></script>
</body>
</html>
